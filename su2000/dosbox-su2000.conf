# DOSBox-X configuration for SU2000 research runs (Milestone 1 logging stub).
# Run from the su2000/ directory:  ../src/dosbox-x -conf dosbox-su2000.conf -set "autoexec ..."  (see tools/run_game.sh)
[sdl]
output=surface
[dosbox]
machine=svga_s3
memsize=32
[cpu]
core=normal
cputype=486
cycles=max
[dos]
xms=true
ems=false
umb=false
[su2000]
enable=true
logfile=logs/trace.su2k
log memory reads=true
[autoexec]
mount c data/work/c
set dos4g=quiet
set vpctemp=c:\vpctemp
path c:\dos;c:\utils
c:
[config]
files=60
