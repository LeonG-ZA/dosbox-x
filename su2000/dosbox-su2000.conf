# DOSBox-X configuration for SU2000 research runs (Milestone 1 logging stub).
# Run from the su2000/ directory:  ../src/dosbox-x -conf dosbox-su2000.conf -set "autoexec ..."  (see tools/run_game.sh)
[sdl]
# the mouse drives the SU2000 tracker: capture it on the first click (Ctrl+F10 releases)
autolock=true
output=surface
[dosbox]
machine=svga_s3
memsize=32
[cpu]
core=normal
cputype=486
cycles=max
[dos]
xms=true
ems=false
umb=false
[midi]
# the Soundscape emulation ([su2000] sound port) uses 0x330
mpu401=none

[keyboard]
# IRQ 12 belongs to the first Soundscape on the two-player cabinet: no PS/2 mouse (the DOS mouse driver still works)
aux=false

[su2000]
enable=true
# CONFIG.VPC [SND]: sound1 port 0x330 IRQ 12, sound2 port 0x350 IRQ 7, DMA 1,3
sound port=0x330:12:1 0x350:7:3
logfile=logs/trace.su2k
log memory reads=true
[autoexec]
mount c data/work/c
mount f data/work/emptycd -t cdrom
set dos4g=quiet
set vpctemp=c:\vpctemp
path c:\dos;c:\utils
c:
[config]
files=60
