# DOSBox-X configuration for SU2000 research runs - second ("Solo", Simon's) HDD dump (Milestone 1 logging stub).
# Run from the su2000/ directory:  ../src/dosbox-x -conf dosbox-su2000.conf -set "autoexec ..."  (see tools/run_game.sh)
[sdl]
# the mouse drives the SU2000 tracker: capture it on the first click (Ctrl+F10 releases)
autolock=true
output=surface
[dosbox]
machine=svga_s3
memsize=32
[cpu]
core=normal
cputype=486
cycles=max
[dos]
xms=true
ems=false
umb=false
[su2000]
enable=true
logfile=logs/trace.su2k
log memory reads=true
[autoexec]
mount c data/work/simon
mount f data/work/emptycd -t cdrom
set dos4g=quiet
set vpctemp=c:\vpctemp
path c:\dos;c:\utils
c:
[config]
files=60
